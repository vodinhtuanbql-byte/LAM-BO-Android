
name: Build LAM BO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LAMBO_WEBVIEW135.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Cannot find Android SDK sdkmanager"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q LAMBO_WEBVIEW135.zip -d project

      - name: Check Android project
        run: |
          ls -la project
          test -f project/settings.gradle || test -f project/settings.gradle.kts
          test -f project/app/build.gradle || test -f project/app/build.gradle.kts

      - name: Build APK
        run: |
          gradle --no-daemon -p project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAM-BO-Android-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
